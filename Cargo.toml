[package]
name = "natwg"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/hackerchai/natwg"
description = "Reach a home LAN over WireGuard from behind carrier-grade NAT"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
getrandom = "0.3"
gotatun = { version = "=0.10.3", default-features = false, features = ["device", "ring", "tun"] }
ipnetwork = { version = "0.21", features = ["serde"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
