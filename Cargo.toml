[package]
name = "natwg"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/hackerchai/natwg"
readme = "README.md"
keywords = ["wireguard", "nat", "cgnat", "stun", "vpn"]
categories = ["command-line-utilities", "network-programming"]
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md"]
description = "Reach a home LAN over WireGuard from behind carrier-grade NAT"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
flate2 = "1"
getrandom = "0.3"
gotatun = { version = "=0.10.3", default-features = false, features = ["device", "ring", "tun"] }
hex = "0.4"
ipnetwork = { version = "0.21", features = ["serde"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
tar = { version = "0.4", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
